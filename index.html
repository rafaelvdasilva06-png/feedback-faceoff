<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Feedback Face-Off</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.app{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.hd .me{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--soft);font-size:14px}
.snd{background:none;border:0;color:var(--soft);display:grid;place-items:center;width:36px;height:36px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center}
h1{font-size:34px;line-height:1.08;letter-spacing:-.03em;margin:8px 0 10px}
.sub{color:var(--body);margin:0 0 22px;font-size:16px}
label{display:block;font-weight:700;font-size:14px;color:var(--soft);margin:0 0 6px}
input[type=text]{width:100%;font-size:18px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);min-height:54px;margin-bottom:14px}
input.code{text-transform:uppercase;letter-spacing:.2em;font-weight:800;font-size:24px;text-align:center}
.wide{width:100%}
.err{color:var(--bad);font-weight:700;min-height:22px;font-size:14px;margin:4px 0 0}
.big{display:inline-block;font-size:64px;font-weight:800;letter-spacing:-.05em;color:var(--ink);background:var(--lime);padding:6px 22px;border-radius:16px;line-height:1.05;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.mini{display:flex;gap:12px;align-items:center}
.mini .av{width:40px;height:40px}
.mini b{display:block}.mini small{color:var(--soft)}
.situ{font-size:15px;color:var(--body);margin:10px 0 0}
.qt{font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:16px 0 12px}
.tbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 14px}.tbar i{display:block;height:100%;background:var(--ink);transition:width .25s linear}
.ans{display:grid;gap:10px}
.ab{text-align:left;background:var(--card);border:2px solid var(--line);border-left:10px solid var(--t);border-radius:16px;padding:14px;display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;font-size:16px;font-weight:600;line-height:1.35;min-height:60px}
.ab .L{width:30px;height:30px;border-radius:9px;background:var(--t);color:#fff;display:grid;place-items:center;font-weight:800}
.ab:active{transform:scale(.98)}
.bk{margin:0 0 14px}
.bk .bl{font-size:13px;font-weight:800;color:var(--soft);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;font-size:15px;font-weight:600;min-height:46px;text-align:left;line-height:1.3}
.chip.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.lock{text-align:center}
.lock .ic{width:84px;height:84px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 16px;animation:pop .5s ease-out both}
.res{text-align:center}
.res .tier{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.res .pts{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;animation:pop .6s ease-out both}
.res.good .pts{color:var(--good)}.res.mid .pts{color:var(--mid)}.res.bad .pts{color:var(--soft)}
.why{margin-top:18px;text-align:left;font-size:15px;color:var(--body)}
.why b{color:var(--ink)}
.rank{margin-top:16px;display:inline-flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700}
.medal{display:inline-block;font-size:15px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:8px}.medal.m1{color:var(--ink);background:var(--lime);padding:4px 12px;border-radius:8px}.medal.m3{color:#b06a2c}
.muted{color:var(--soft)}
.conn{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--bad);color:#fff;font-weight:800;padding:8px 14px;border-radius:10px}
</style>
</head>
<body>
<div class="app">
  <div class="hd"><span class="mark"><i></i>Feedback Face-Off</span><span class="me" id="meTag"></span></div>
  <div id="ui" class="center"></div>
</div>
<div class="conn hidden" id="conn">Reconnecting…</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="content.js"></script>
<script>
{
const $ = s => document.querySelector(s), esc = U.esc, ls = U.ls, F = window.FF;
const net = U.net(), ui = $('#ui'), L = ['A','B','C','D'];
let code = (location.hash.slice(1) || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
const slot = (location.search.match(/[?&]p=(\w+)/) || [])[1] || '';
let me = null, St = null, joined = false, unsub = null, sent = {}, picks = [], status = '', lastTick = null;

net.connected(ok => $('#conn').classList.toggle('hidden', ok));
const meKey = () => 'ff_me_' + code + slot;
function load(){ me = ls.get(meKey(), null); joined = !!me; sent = (me && me.sent) || {} }
const saveMe = () => { if (me) { me.sent = sent; ls.set(meKey(), me) } };

function connect(){
  if (unsub) unsub();
  load();
  unsub = net.on(`games/${code}/state`, v => {
    const prev = St; St = v; status = v ? '' : 'nogame';
    if (!prev || !v || prev.phase !== v.phase || prev.qi !== v.qi) { picks = []; if (v && prev && joined) cue(v) }
    render();
  });
}
function cue(v){
  const b = me && (v.board || {})[me.uid];
  if (v.phase === 'q') U.sfx.soft();
  else if (v.phase === 'reveal') { const m = F.byId(v.ids[v.qi]), mx = 3; if (b) setTimeout(() => U.sfx.tier(b.base === mx ? 'Dialed' : b.base > 0 ? 'Warm' : 'Miss'), 300) }
  else if (v.phase === 'final') { if (b && b.rank <= 3) { U.sfx.fanfare(); U.confetti(3500) } else U.sfx.reveal() }
}
function join(name){
  U.sfx.unlock(); U.sfx.pop();
  me = { uid: U.rid(10), name: name.slice(0, 18) }; joined = true; sent = {}; saveMe();
  net.set(`games/${code}/players/${me.uid}`, { name: me.name, at: net.TS() }); render();
}
function answer(a){
  sent[St.qi] = a; saveMe();
  net.set(`games/${code}/answers/${St.qi}/${me.uid}`, { a, t: net.TS() }); U.sfx.lock(); render();
}
setInterval(() => {
  if (!St || St.phase !== 'q') return;
  const ms = St.endsAt - net.now(), b = $('#tb'), sec = Math.max(0, Math.ceil(ms / 1000));
  if (b) b.style.width = Math.max(0, Math.min(100, ms / (St.dur || 30000) * 100)) + '%';
  if (sec <= 5 && sec > 0 && sec !== lastTick && sent[St.qi] == null) { lastTick = sec; U.sfx.tick(sec <= 1) }
}, 250);

function head(){
  const b = St && me && (St.board || {})[me.uid];
  $('#meTag').innerHTML = me && joined ? `<i class="dot" style="--c:${U.color(me.uid)}"></i>${esc(me.name)}${b ? ' · ' + U.fmt(b.score) : ''}<button class="snd" id="snd" aria-label="Sound">${U.speakerSVG(U.sfx.muted)}</button>` : '';
  const s = $('#snd'); if (s) s.onclick = () => { s.innerHTML = U.speakerSVG(U.sfx.toggle()) };
}
function render(){
  head(); ui.classList.add('center');
  if (!code) return renderCode();
  if (status === 'nogame') return renderMsg('Game not found', `No game with code ${esc(code)} is running. Check the code on the screen.`, true);
  if (!St) return renderMsg('Connecting…', '');
  if (!joined) return ['lobby','entry','intro','q','reveal'].includes(St.phase) ? renderJoin() : renderMsg('This game has ended', 'Wait for the host to start a new one.', true);
  if (St.phase === 'lobby') return renderMsg(`You're in!`, `<div class="big">${St.total || 1}</div><p class="muted" style="margin:6px 0 0">${(St.total || 1) === 1 ? 'player' : 'players'} in the lobby. Look at the big screen, the game starts soon.</p>`);
  if (St.phase === 'entry') return renderMsg('Entering the office', 'Welcome to Tejo &amp; Partners, Lisbon. Look at the big screen.');
  if (St.phase === 'intro') { const c = St.who && F.P[St.who]; return renderMsg(c ? `${c.name} is coming over` : 'Someone is coming over', 'Listen to what they say on the big screen. Your answer options appear here next.') }
  if (St.phase === 'q') return sent[St.qi] != null ? renderLocked() : renderQ();
  if (St.phase === 'reveal') return renderReveal();
  if (St.phase === 'final') return renderFinal();
}
function renderMsg(t, html, back){
  ui.innerHTML = `<div class="lock"><h1>${esc(t)}</h1><div class="sub">${html}</div>${back ? '<button class="btn ghost" id="bk">Enter another code</button>' : ''}</div>`;
  if (back) $('#bk').onclick = () => { code = ''; location.hash = ''; if (unsub) unsub(); St = null; render() };
}
function renderCode(){
  ui.innerHTML = `<span class="lbl">Join a game</span><h1>Enter the code<br>on the screen</h1>
    <form id="f"><input type="text" class="code" id="c" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" aria-label="Game code"><button class="btn lime wide">Continue</button></form>`;
  $('#c').focus();
  $('#f').onsubmit = e => { e.preventDefault(); const v = $('#c').value.toUpperCase().replace(/[^A-Z]/g, ''); if (v.length === 4) { code = v; location.hash = v; St = null; connect() } };
}
function renderJoin(){
  ui.innerHTML = `<span class="lbl">Game ${esc(code)}</span><h1>Pick a name</h1><p class="sub">It shows on the big screen and the podium.</p>
    <form id="f"><input type="text" id="n" maxlength="18" autocomplete="off" placeholder="Your name" aria-label="Your name"><button class="btn lime wide" id="go" disabled>Join the game</button><p class="err" id="er"></p></form>`;
  const n = $('#n'); n.focus();
  n.oninput = () => { $('#go').disabled = n.value.trim().length < 1 };
  $('#f').onsubmit = e => { e.preventDefault(); const v = n.value.trim(); if (v) join(v) };
}
function mini(m){
  const c = F.P[m.who];
  return `<div class="card"><div class="mini"><div class="av" style="background:${c.col}">${esc(c.name[0])}</div><div><b>${esc(c.name)} · ${esc(c.tag)}</b><small>${esc(c.role)}</small></div></div><p class="situ">${esc(m.situ)}</p></div>`;
}
function renderQ(){
  const m = F.byId(St.ids[St.qi]), ord = St.ord;
  let body;
  if (m.type === 'mc') {
    body = `<div class="ans">${ord.map((oi, k) => `<button class="ab t${k}" data-o="${oi}"><span class="L">${L[k]}</span><span>${esc(m.o[oi].t)}</span></button>`).join('')}</div>`;
  } else {
    body = m.blanks.map((b, i) => `<div class="bk"><div class="bl">${i + 1} · ${esc(b.label)}</div><div class="chips">${ord[i].map(oi => `<button class="chip ${picks[i] === oi ? 'sel' : ''}" data-b="${i}" data-o="${oi}">${esc(b.opts[oi])}</button>`).join('')}</div></div>`).join('')
      + `<button class="btn lime wide" id="sub" ${m.blanks.every((_, i) => picks[i] != null) ? '' : 'disabled'}>Lock in my sentence</button>`;
  }
  ui.innerHTML = `<div><span class="lbl">Moment ${St.qi + 1} of ${St.n} · ${esc(m.concept)}</span><div class="tbar" style="margin-top:8px"><i id="tb"></i></div>${mini(m)}<p class="qt">${esc(m.q)}</p>${body}</div>`;
  ui.classList.remove('center');
  if (m.type === 'mc') ui.querySelectorAll('.ab').forEach(b => b.onclick = () => answer(+b.dataset.o));
  else {
    ui.querySelectorAll('.chip').forEach(c => c.onclick = () => { picks[+c.dataset.b] = +c.dataset.o; U.sfx.soft(); renderQ() });
    $('#sub').onclick = () => answer(picks.slice());
  }
}
function renderLocked(){
  ui.innerHTML = `<div class="lock"><div class="ic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1d7a4c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><h1>Locked in</h1><p class="sub">Faster correct answers earn more points. Eyes on the big screen.</p></div>`;
}
function renderReveal(){
  const m = F.byId(St.ids[St.qi]), b = (St.board || {})[me.uid] || {}, base = b.base;
  const cls = base == null ? 'bad' : base === 3 ? 'good' : base > 0 ? 'mid' : 'bad';
  const tier = base == null ? 'No answer' : m.type === 'mc' ? (base === 3 ? 'Best answer!' : base === 1 ? 'Partly right' : 'Not quite') : (base === 3 ? 'Perfect sentence!' : `${base} of 3 right`);
  ui.innerHTML = `<div class="res ${cls}"><span class="lbl">Moment ${St.qi + 1} of ${St.n}</span><div class="tier">${esc(tier)}</div><div class="pts">+${U.fmt(b.gain || 0)}</div>
    ${b.rank ? `<div class="rank">#${b.rank} of ${St.total} · ${U.fmt(b.score)} pts</div>` : ''}
    <div class="why card"><b>${esc(m.concept)}.</b> ${esc(m.why)}</div></div>`;
}
function renderFinal(){
  const b = (St.board || {})[me.uid];
  const md = b && b.rank <= 3 ? ['1st', '2nd', '3rd'][b.rank - 1] : '';
  ui.innerHTML = `<div class="res good"><span class="lbl">Final results</span>${md ? `<div class="medal m${b.rank}">${md} place</div>` : ''}
    <div class="pts" style="margin-top:10px">${b ? '#' + b.rank : '–'}</div><p class="sub" style="margin-top:8px">${b ? `of ${St.total} players · ${U.fmt(b.score)} points` : 'Thanks for playing'}</p>
    <p class="muted">Look up at the podium.</p></div>`;
}
document.addEventListener('click', () => U.sfx.unlock(), { once: true });
if (code) connect(); render();
}
</script>
</body>
</html>

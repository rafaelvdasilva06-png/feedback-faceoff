@media (max-width:900px){.lobby{grid-template-columns:1fr;overflow:auto}.qpanel,.setup{width:auto;left:0;right:0}.subs,.ntag{max-width:none;right:0}}

<body>
<div id="scene3d"></div>
<div class="stage">
  <div class="bar"><span class="mark"><i></i>Feedback Face-Off</span><div class="r" id="barR"></div></div>
  <div class="main" id="ui"></div>
</div>
<div class="conn hidden" id="conn">Reconnecting to the live server…</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="content.js"></script>
<script type="module">
import { createOffice, ambience } from './office.js';

const $ = s => document.querySelector(s), esc = U.esc, ls = U.ls, F = window.FF;
const net = U.net(), ui = $('#ui');
const L = ['A','B','C','D'];
const BOTS = ['Inês','Tomás','Beatriz','Miguel','Sofia'];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const initials = n => String(n).replace(/\(.*?\)/g, '').replace(/[^\p{L}\s]/gu, '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
const sleep = ms => new Promise(r => setTimeout(r, ms));
let S = ls.get('ff_host', null) || { phase: 'setup' };
let players = {}, answers = {}, unsubs = [], finalBuilt = false, seen = new Set(), lastTick = null, seq = 0, subs = null;
const saveS = () => ls.set('ff_host', S);
const G = p => `games/${S.code}/${p}`;
const durFor = m => (m.type === 'fill' ? 45 : 30) * 1000 * (ls.get('ff_pace', 'normal') === 'relaxed' ? 1.5 : 1);
const joinUrl = () => location.href.replace(/host\.html.*$/, '').replace(/[?#].*$/, '') + '#' + S.code;

/* ---------- 3D office (falls back to a plain screen if WebGL is unavailable) ---------- */
let O = null;
if (!/[?&]lite/.test(location.search)) { try { O = createOffice($('#scene3d')) } catch (e) { console.warn('3D off', e) } }
if (!O) document.body.classList.add('no3d');
const amb = ambience(() => U.sfx.muted);

/* ---------- voices ---------- */
const synth = window.speechSynthesis;
let voices = [];
const loadVoices = () => { try { voices = synth ? synth.getVoices().filter(v => /^en/i.test(v.lang)) : [] } catch (e) { voices = [] } };
loadVoices(); if (synth) synth.onvoiceschanged = loadVoices;
const FEM = /female|samantha|victoria|karen|moira|tessa|fiona|serena|susan|zira|hazel|kate|libby|sonia|aria|jenny|emma|amy|joanna|salli|kimberly|ava|allison|martha/i;
const MAL = /\bmale|daniel|alex\b|fred|oliver|george|ryan|guy|david|mark|james|arthur|thomas|brian|matthew|joey|aaron|reed|rishi/i;
function pickVoice(female, idx = 0){
  const pool = voices.filter(v => female ? FEM.test(v.name) : MAL.test(v.name));
  const list = (pool.length ? pool : voices).slice().sort((a, b) => (/GB|UK/i.test(b.lang + b.name) ? 1 : 0) - (/GB|UK/i.test(a.lang + a.name) ? 1 : 0));
  return list.length ? list[idx % list.length] : null;
}
function say(text, who, v = {}, actorTalk){
  return new Promise(res => {
    subs = { who, text }; drawSubs();
    const done = () => { if (actorTalk) actorTalk(false); res() };
    if (actorTalk) actorTalk(true);
    const est = 900 + text.length * 62;
    if (!synth || U.sfx.muted || !voices.length) return setTimeout(done, est);
    try {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/…/g, '... '));
      const vc = pickVoice(v.female, v.idx || 0); if (vc) u.voice = vc;
      u.pitch = v.pitch || 1; u.rate = v.rate || 1; u.volume = 1;
      let fin = false; const f = () => { if (!fin) { fin = true; done() } };
      u.onend = f; u.onerror = f; setTimeout(f, est * 1.8 + 2000);
      synth.speak(u);
    } catch (e) { setTimeout(done, est) }
  });
}
function drawSubs(){
  let el = $('#subs');
  if (!subs) { if (el) el.remove(); return }
  if (!el) { el = document.createElement('div'); el.id = 'subs'; el.className = 'subs float'; ui.appendChild(el) }
  el.innerHTML = `<span class="who">${esc(subs.who)}</span>${esc(subs.text)}`;
}
const clearSubs = () => { subs = null; drawSubs() };
const voiceIdx = { marta: 0, carolina: 1, leonor: 2, ana: 3, rui: 0, diogo: 1, tomas: 2 };
function speakAs(m, text){
  const c = F.P[m.who];
  return say(text, c.name, Object.assign({ idx: voiceIdx[m.who] || 0 }, c.voice || {}), on => O && O.talking(on));
}
const REACT = {
  good: ['Thanks. That really helps.', "Okay, that's fair. I'll do that.", 'Thank you for telling me like that.'],
  mid: ['Hmm… okay. I think I get it.', "Right. I'll try."],
  bad: ['…Right. Fine.', 'Wow. Okay.', '…Noted.']
};
const juniors = [
  { skin: '#f1c9a5', hair: '#3b2a20', style: 'short', top: '#c9d6e3', h: 1.72 },
  { skin: '#c68863', hair: '#1b1b1b', style: 'ponytail', female: true, top: '#e8e2d6', h: 1.65 },
  { skin: '#f5d6bd', hair: '#8a5a2b', style: 'short', top: '#5f8f4f', h: 1.75 }
];

net.connected(ok => $('#conn').classList.toggle('hidden', ok));

function roster(){
  const o = {};
  Object.entries(players || {}).forEach(([id, p]) => { if (p && p.name) o[id] = { name: String(p.name).slice(0, 18), at: p.at || 0 } });
  Object.entries(S.bots || {}).forEach(([id, b]) => o[id] = b);
  return o;
}
function ranked(){
  const r = roster();
  return Object.keys(r).map(id => ({ id, name: r[id].name, score: (S.scores || {})[id] || 0, gain: (S.gains || {})[id] })).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
}
function publish(){
  if (!S.code) return;
  const board = {}, r = ranked();
  r.forEach((p, i) => board[p.id] = { score: p.score, gain: p.gain == null ? null : p.gain, base: (S.bases || {})[p.id] ?? null, rank: i + 1 });
  net.set(G('state'), { game: 'ff', phase: S.phase, qi: S.qi, n: S.ids.length, ids: S.ids, ord: S.ord || null, endsAt: S.endsAt || 0, dur: S.dur || 0, total: r.length, board, who: S.qi >= 0 && S.ids[S.qi] ? F.byId(S.ids[S.qi]).who : null });
}
function listen(){
  unsubs.forEach(f => f()); unsubs = [];
  if (!S.code) return;
  unsubs.push(net.on(G('players'), v => {
    players = v || {};
    Object.keys(players).forEach(id => { if (!seen.has(id)) { seen.add(id); if (S.phase === 'lobby') U.sfx.pop() } });
    if (S.phase === 'lobby') { publish(); drawLobbyCrowd() } else if (S.phase === 'q') { drawAnswered(); maybeEnd() }
  }));
  if (S.phase === 'q' || S.phase === 'reveal') unsubs.push(net.on(G('answers/' + S.qi), v => {
    answers = v || {};
    if (S.phase === 'q') { drawAnswered(); maybeEnd() }
  }));
}

/* ---------- flow ---------- */
function newGame(){
  const code = Array.from(crypto.getRandomValues(new Uint8Array(4)), b => 'ABCDEFGHJKMNPQRSTUVWXYZ'[b % 23]).join('');
  if (S.code) net.remove('games/' + S.code);
  const last = ls.get('ff_last', []);
  S = { phase: 'lobby', code, ids: F.pick(last), qi: -1, scores: {}, gains: {}, bases: {}, bots: {} };
  ls.set('ff_last', S.ids);
  players = {}; answers = {}; seen = new Set(); finalBuilt = false; seq++;
  if (O) { O.leaveAll(true); O.lobbyView() }
  saveS(); listen(); publish(); render();
}
function addBots(){ BOTS.forEach(n => S.bots['bot_' + n] = { name: n + ' (test)', at: Date.now() }); U.sfx.pop(); saveS(); publish(); render() }
async function enterOffice(){
  const my = ++seq;
  S.phase = 'entry'; saveS(); publish(); render(); U.sfx.whoosh();
  const line = 'Good morning! Welcome to Tejo and Partners. Your team is waiting for you inside.';
  if (O) await O.entry(async r => { await say(line, 'Reception', { female: true, pitch: 1.05, idx: 4 }, on => { r.st.talking = on }) });
  else await say(line, 'Reception', { female: true });
  if (my !== seq) return;
  clearSubs(); startQ(0);
}
async function startQ(qi){
  const my = ++seq, m = F.byId(S.ids[qi]), c = F.P[m.who];
  S.phase = 'intro'; S.qi = qi; S.gains = {}; S.bases = {}; S.tier = null;
  saveS(); publish(); render();
  if (O) await O.approach(c.look, qi, { extras: m.extras ? juniors : [] });
  if (my !== seq) return;
  await speakAs(m, m.line);
  if (my !== seq) return;
  await sleep(400);
  S.phase = 'q';
  S.ord = m.type === 'mc' ? shuffle([0,1,2,3]) : m.blanks.map(b => shuffle(b.opts.map((_, i) => i)));
  S.dur = durFor(m); S.endsAt = net.now() + S.dur;
  answers = {}; lastTick = null;
  saveS(); listen(); publish(); U.sfx.soft(); render(); botsAnswer();
}
function botsAnswer(){
  const m = F.byId(S.ids[S.qi]), q = S.qi;
  Object.keys(S.bots || {}).forEach(id => setTimeout(() => {
    if (S.phase !== 'q' || S.qi !== q) return;
    const a = m.type === 'mc' ? (Math.random() < .55 ? m.o.findIndex(o => o.p === 3) : Math.floor(Math.random() * 4)) : m.blanks.map(b => Math.random() < .6 ? b.ok : Math.floor(Math.random() * b.opts.length));
    S.botAns = S.botAns || {}; S.botAns[id] = { a, t: net.now() }; drawAnswered(); maybeEnd();
  }, 2000 + Math.random() * S.dur * .5));
}
function allAnswers(){ return Object.assign({}, answers || {}, S.botAns || {}) }
function maybeEnd(){
  if (S.phase !== 'q') return;
  const n = Object.keys(roster()).length, got = Object.keys(allAnswers()).filter(id => roster()[id]).length;
  if (n > 0 && got >= n) setTimeout(() => { if (S.phase === 'q') reveal() }, 700);
}
function roomTier(m){
  if (!S.answeredN) return 'mid';
  if (m.type === 'mc') { let best = 0; S.dist.forEach((c, i) => { if (c > S.dist[best]) best = i }); const p = m.o[best].p; return p === 3 ? 'good' : p === 1 ? 'mid' : 'bad' }
  const vals = Object.values(S.bases).filter(v => v != null), avg = vals.reduce((a, b) => a + b, 0) / Math.max(1, vals.length);
  return avg >= 2.5 ? 'good' : avg >= 1.5 ? 'mid' : 'bad';
}
function reveal(){
  if (S.phase !== 'q') return;
  const m = F.byId(S.ids[S.qi]), A = allAnswers(), r = roster();
  S.gains = {}; S.bases = {}; S.dist = m.type === 'mc' ? [0,0,0,0] : m.blanks.map(b => b.opts.map(() => 0));
  Object.keys(r).forEach(id => {
    const x = A[id];
    if (!x) { S.gains[id] = 0; S.bases[id] = null; return }
    const b = F.base(m, x.a);
    const frac = Math.max(0, Math.min(1, (S.endsAt - (x.t || S.endsAt)) / S.dur));
    const pts = b > 0 ? Math.round(b * 100 * (1 + .5 * frac)) : 0;
    S.scores[id] = (S.scores[id] || 0) + pts; S.gains[id] = pts; S.bases[id] = b;
    if (m.type === 'mc') { if (S.dist[x.a] != null) S.dist[x.a]++ }
    else (x.a || []).forEach((v, i) => { if (S.dist[i] && S.dist[i][v] != null) S.dist[i][v]++ });
  });
  S.answeredN = Object.keys(A).filter(id => r[id]).length;
  S.tier = roomTier(m);
  S.phase = 'reveal'; S.botAns = {};
  saveS(); publish(); U.sfx.reveal(); render();
  if (O) O.react(S.tier);
  const lines = REACT[S.tier], q = S.qi;
  setTimeout(() => { if (S.phase === 'reveal' && S.qi === q) speakAs(m, lines[Math.floor(Math.random() * lines.length)]).then(() => { if (S.phase === 'reveal' && S.qi === q) clearSubs() }) }, 900);
}
async function next(){
  clearSubs(); if (synth) synth.cancel();
  if (O) O.leaveAll();
  if (S.qi + 1 < S.ids.length) return startQ(S.qi + 1);
  const my = ++seq;
  S.phase = 'final'; finalBuilt = false; saveS(); publish(); bar();
  ui.innerHTML = '';
  if (O) await O.finalView();
  if (my !== seq) return;
  render();
}

setInterval(() => {
  if (S.phase !== 'q') return;
  const ms = S.endsAt - net.now(), sec = Math.max(0, Math.ceil(ms / 1000)), el = $('#ring');
  if (el) { el.style.background = `conic-gradient(${sec <= 5 ? 'var(--bad)' : 'var(--ink)'} ${Math.max(0, ms / S.dur) * 360}deg, var(--line) 0)`; el.querySelector('span').textContent = sec }
  if (sec <= 5 && sec > 0 && sec !== lastTick) { lastTick = sec; U.sfx.tick(sec <= 1) }
  if (ms <= 0) reveal();
}, 250);

/* ---------- render ---------- */
function bar(){
  const snd = `<button class="snd" id="snd" aria-label="Sound on or off">${U.speakerSVG(U.sfx.muted)}</button>`;
  const r = $('#barR');
  if (S.phase === 'setup') r.innerHTML = `<span>Tejo &amp; Partners · Lisbon</span>${snd}`;
  else if (S.phase === 'lobby') r.innerHTML = `<span>Game code</span><span class="codepill">${esc(S.code)}</span>${snd}`;
  else if (S.phase === 'final') r.innerHTML = `<span>Final results</span>${snd}`;
  else if (S.phase === 'entry') r.innerHTML = `<span>Arriving at the office</span><span class="codepill">${esc(S.code)}</span>${snd}`;
  else r.innerHTML = `<span>Moment ${S.qi + 1} of ${S.ids.length}</span><span class="codepill">${esc(S.code)}</span>${snd}`;
  $('#snd').onclick = () => { const m = U.sfx.toggle(); $('#snd').innerHTML = U.speakerSVG(m); amb.setMuted(m); if (m && synth) synth.cancel() };
}
function render(){
  bar();
  if (S.phase === 'setup') return renderSetup();
  if (S.phase === 'lobby') return renderLobby();
  if (S.phase === 'entry') { ui.innerHTML = ''; drawSubs(); return }
  if (S.phase === 'intro') return renderIntro();
  if (S.phase === 'q' || S.phase === 'reveal') return renderQ();
  if (S.phase === 'final') return renderFinal();
}
function renderSetup(){
  if (O) O.setupView();
  const p = ls.get('ff_pace', 'normal');
  ui.innerHTML = `<div class="setup float"><span class="lbl">Nova SBE · Communication · Feedback</span>
      <h1>Feedback<br><em>Face-Off</em></h1>
      <p>Walk into the Lisbon office of Tejo &amp; Partners. Colleagues come up to you, each with their own personality. The room answers on their phones, and the best feedback wins.</p>
      <div class="how"><div><b>1 · Scan to join</b>No app, no account</div><div><b>2 · Listen</b>A colleague walks up and talks to you</div><div><b>3 · Answer</b>Best answer + speed = points</div><div><b>4 · Watch them react</b>Then the podium</div></div>
      <div class="row"><button class="btn lime" id="open">Open the lobby</button><div class="seg" id="pace"><button data-p="normal" class="${p === 'normal' ? 'on' : ''}">Normal pace</button><button data-p="relaxed" class="${p === 'relaxed' ? 'on' : ''}">Relaxed pace</button></div></div>
    </div>`;
  $('#pace').onclick = e => { const b = e.target.closest('button'); if (b) { ls.set('ff_pace', b.dataset.p); renderSetup() } };
  $('#open').onclick = () => { U.sfx.unlock(); amb.start(); amb.setMuted(U.sfx.muted); newGame() };
}
function renderLobby(){
  if (O) O.lobbyView();
  ui.innerHTML = `<div class="lobby">
    <div class="joinbox float"><span class="lbl">Join the game</span>
      <h1>Scan to play</h1>
      <p>Open your camera, scan, pick a name.</p>
      <div class="qrw"><div class="qr" id="qr"></div>
        <div><span class="lbl">Game code</span><div class="code">${esc(S.code)}</div><div class="url">${esc(joinUrl().replace(/^https?:\/\//, '').replace(/#.*$/, ''))}</div></div></div>
    </div>
    <div class="crowd float"><div id="crowd" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
      <div class="lfoot"><button class="link" id="bots">Add 5 test players</button><button class="btn lime" id="go">Enter the office</button></div></div>
  </div>`;
  try { new QRCode($('#qr'), { text: joinUrl(), width: 380, height: 380, colorDark: '#101418', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }) } catch (e) { $('#qr').textContent = 'QR unavailable' }
  $('#bots').onclick = addBots;
  $('#go').onclick = () => { U.sfx.unlock(); amb.start(); enterOffice() };
  drawLobbyCrowd();
}
let shownNames = new Set();
function drawLobbyCrowd(){
  const el = $('#crowd'); if (!el || S.phase !== 'lobby') return;
  const r = roster(), ids = Object.keys(r).sort((a, b) => (r[a].at || 0) - (r[b].at || 0)), n = ids.length;
  el.innerHTML = `<div class="cnt"><div class="num">${n}</div><div><b>${n === 1 ? 'player has joined' : 'players have joined'}</b><span>${n ? 'Start when the room is in.' : 'Be the first to scan.'}</span></div></div>
    <div class="names">${n ? ids.map(id => `<span style="${shownNames.has(id) ? 'animation:none' : ''}"><i class="dot" style="--c:${U.color(id)}"></i>${esc(r[id].name)}</span>`).join('') : '<div class="empty"><i></i>Waiting for the first player</div>'}</div>`;
  ids.forEach(id => shownNames.add(id));
  const go = $('#go'); if (go) go.disabled = n === 0;
}
function nameTag(m){
  const c = F.P[m.who];
  return `<div class="ntag float"><div class="av" style="background:${c.col}">${esc(c.name[0])}</div><div><b>${esc(c.name)}</b><small>${esc(c.role)}</small><span class="tagp">${esc(c.tag)}</span><p>${esc(c.desc)}</p></div></div>`;
}
function renderIntro(){
  const m = F.byId(S.ids[S.qi]);
  ui.innerHTML = nameTag(m) + `<div class="listen float"><i></i>${esc(F.P[m.who].name)} is coming over… listen</div>`;
  drawSubs();
}
function renderQ(){
  const m = F.byId(S.ids[S.qi]), rev = S.phase === 'reveal', c = F.P[m.who];
  const tot = Math.max(1, S.answeredN || 0);
  let body = '';
  if (m.type === 'mc') {
    body = `<div class="tiles">${S.ord.map((oi, k) => {
      const o = m.o[oi], n = rev ? (S.dist[oi] || 0) : 0;
      const cls = rev ? (o.p === 3 ? 'best' : o.p === 1 ? 'part' : 'dim') : '';
      return `<div class="tile t${k} ${cls}"><span class="L">${L[k]}</span><span>${esc(o.t)}${rev && o.p ? `<span class="bdg">${o.p === 3 ? '✓ Best answer' : 'Partly right'}</span>` : ''}</span>${rev ? `<span class="cnt2">${n}</span><span class="fill" style="width:${n / tot * 100}%"></span>` : ''}</div>`;
    }).join('')}</div>`;
  } else {
    body = `<div class="sent">${m.parts.map((p, i) => esc(p) + (i < m.blanks.length ? `<span class="slot ${rev ? 'ok' : ''}">${esc(rev ? m.blanks[i].opts[m.blanks[i].ok] : m.blanks[i].label)}</span>` : '')).join('')}</div>`
      + (rev ? `<div class="right">${m.blanks.map((b, i) => `<div><span>${i + 1} · ${esc(b.label)}</span><b>${Math.round((S.dist[i][b.ok] || 0) / tot * 100)}% chose right</b></div>`).join('')}</div>`
             : `<div class="blanks">${m.blanks.map((b, i) => `<div class="blank"><span class="bl">${i + 1} · ${esc(b.label)}</span><div class="chips">${S.ord[i].map(oi => `<span class="chip">${esc(b.opts[oi])}</span>`).join('')}</div></div>`).join('')}</div>`);
  }
  const top = rev ? ranked().slice(0, 5) : [];
  const moodTxt = { good: `The room mostly got it right, and ${c.name} relaxes.`, mid: `The room was half right. ${c.name} isn't convinced.`, bad: `Most of the room got it wrong. ${c.name} shuts down.` }[S.tier] || '';
  const moodCol = { good: 'var(--good)', mid: 'var(--mid)', bad: 'var(--bad)' }[S.tier];
  ui.innerHTML = nameTag(m) + `<div class="qpanel float">
      <span class="concept">${esc(m.concept)}</span>
      <div class="qh"><h2 class="qtext">${esc(m.q)}</h2>${rev ? '' : `<div class="ring" id="ring"><span></span></div>`}</div>
      <p class="ctxl">${esc(m.situ)}</p>
      ${body}
      ${rev ? `<div class="explain"><b>Why:</b> ${esc(m.why)}</div>
        <div class="mood" style="--c:${moodCol}"><i></i>${esc(moodTxt)}</div>
        <div class="top5">${top.map((p, i) => `<div style="animation-delay:${.12 * i}s"><span class="rk">${i + 1}</span>${esc(p.name)} <span class="g">${p.gain ? '+' + U.fmt(p.gain) : ''}</span></div>`).join('')}</div>` : ''}
      <div class="qfoot">${rev ? `<span></span><button class="btn lime" id="nx">${S.qi + 1 < S.ids.length ? 'Next colleague' : 'Show the podium'}</button>` : `<span class="answered" id="ans"></span><button class="btn ghost" id="skip">End now</button>`}</div>
    </div>`;
  drawSubs();
  if (rev) $('#nx').onclick = next; else { $('#skip').onclick = reveal; drawAnswered() }
}
function drawAnswered(){
  const el = $('#ans'); if (!el) return;
  const r = roster(), n = Object.keys(r).length, got = Object.keys(allAnswers()).filter(id => r[id]).length;
  el.innerHTML = `<b>${got}</b> / ${n} answered`;
}
function renderFinal(){
  clearSubs();
  const r = ranked();
  if (finalBuilt) return; finalBuilt = true;
  if (!r.length) { ui.innerHTML = `<div class="final float"><h2>No players this time</h2><div class="fbtn"><button class="btn lime" id="again">New game</button></div></div>`; $('#again').onclick = () => newGame(); return }
  const slot = (p, cls, md) => p ? `<div class="ps ${cls}"><div class="av" style="background:${U.color(p.id)}">${esc(initials(p.name))}</div><div class="nm">${esc(p.name)}</div><div class="blk"><div class="md">${md}</div><div class="sc" data-to="${p.score}">0 pts</div></div></div>` : '<div></div>';
  ui.innerHTML = `<div class="final float"><span class="lbl">Final results · ${r.length} players</span>
    <h2 id="fh">And the best feedback giver is…</h2>
    <div class="pod">${slot(r[1], 'p2', '2nd')}${slot(r[0], 'p1', '1st')}${slot(r[2], 'p3', '3rd')}</div>
    <div class="board" id="board">${r.slice(3, 23).map((p, i) => `<div><span class="rk">${i + 4}</span><i class="dot" style="--c:${U.color(p.id)}"></i><span class="nm2">${esc(p.name)}</span><span class="s">${U.fmt(p.score)}</span></div>`).join('')}</div>
    <div class="fbtn"><button class="btn ghost" id="again">New game</button></div></div>`;
  $('#again').onclick = () => { finalBuilt = false; newGame() };
  const show = (cls, snd) => { const el = ui.querySelector('.ps.' + cls); if (!el) return; el.classList.add('in'); snd();
    const a = el.querySelector('.sc'), to = +a.dataset.to, t0 = performance.now();
    (function f(t){ const k = Math.min(1, (t - t0) / 1100); a.textContent = U.fmt(to * (1 - Math.pow(1 - k, 3))) + ' pts'; if (k < 1) requestAnimationFrame(f) })(t0) };
  U.sfx.drumroll(2.4);
  setTimeout(() => show('p3', U.sfx.hit), 2600);
  setTimeout(() => show('p2', U.sfx.hit), 3700);
  setTimeout(() => { show('p1', U.sfx.fanfare); U.confetti(); const h = $('#fh'); if (h && r[0]) h.textContent = r[0].name + ' gives the best feedback!' }, 5000);
  setTimeout(() => { const b = $('#board'); if (b) b.classList.add('in') }, 5900);
}

/* ---------- resume after a refresh ---------- */
listen();
if (S.phase === 'entry') { render(); enterOffice() }
else if (S.phase === 'intro') startQ(S.qi);
else {
  if ((S.phase === 'q' || S.phase === 'reveal') && O) { const m = F.byId(S.ids[S.qi]); O.approach(F.P[m.who].look, S.qi, { instant: true, extras: m.extras ? juniors : [] }).then(() => { if (S.phase === 'reveal') O.react(S.tier) }) }
  if (S.phase === 'final' && O) O.finalView();
  render();
}
window.__ff = { get S(){ return S }, O };
</script>
